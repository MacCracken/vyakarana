; vyakarana stand-in -- not from vidya. See docs/adr/0006-standin-corpus-policy.md.
; Re-sync when vidya adds an INI reference sample.
;
; Demonstrates the common INI dialect: section headers,
; key=value pairs, comments with both `;` (classic) and `#`
; (modern), quoted and unquoted values, and the [section.sub]
; nested-key convention used by some dialects.

[server]
host          = 0.0.0.0
port          = 8080
workers       = 4
max_body_size = 1048576
debug         = false

# `#`-style comments are also recognised — common in
# tools like systemd unit files and Python ConfigParser.
[logging]
level         = info
format        = json
file          = /var/log/concept.log
rotation      = daily
keep_days     = 30

[auth]
provider      = oauth2
issuer        = https://auth.example.com
audience      = "concept-api"
allow_signups = true

[auth.providers.github]
client_id     = "Iv1.abc123def456"
client_secret = "ghp_REDACTED"
scopes        = "user:email,read:org"

[auth.providers.google]
client_id     = "1234.apps.googleusercontent.com"
scopes        = "openid email profile"

[features]
streaming     = true
metrics       = true
tracing       = false

; Repeated keys (multiple values) — convention varies by
; parser; this stand-in uses comma-separated values inside
; one assignment.
[cors]
origins       = https://app.example.com,https://staging.example.com
allow_methods = GET,POST,PUT,DELETE,PATCH
allow_headers = Content-Type,Authorization,X-Request-Id
expose        = X-Request-Id,X-RateLimit-Remaining

[database]
url           = postgres://user:pass@db.example.com:5432/concept
pool_min      = 2
pool_max      = 16
timeout_ms    = 5000

; Numeric and boolean values stay as plain text from the
; tokenizer's perspective; consumers (config parsers) decide
; how to interpret them.
[limits]
ratelimit     = 100/minute
upload_max_mb = 25
session_ttl   = 3600


# 2.3.2 error-hole coverage: values are free-form text. `%`
# drives configparser interpolation; `^`, backtick and `~` all
# turn up unquoted in real config values.
[interpolation]
log_dir      = /var/log/%(app_name)s
archive_cmd  = tar czf %(log_dir)s/`date +%F`.tgz
home_relative= ~/.config/vyakarana
caret_range  = ^1.2.3
