name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:                    # reusable by release.yml as a gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Cyrius toolchain
        run: |
          set -e
          # The cyrius.cyml `[package].cyrius` pin is the single source of
          # truth for the toolchain version — no version hardcoded here.
          # The upstream installer lays out the version-matched stdlib
          # snapshot at ~/.cyrius/versions/<pin>/lib, which `cyrius deps`
          # copies into ./lib (gitignored since 2.2.2 — ADR 0018). The old
          # manual tar+cp dropped the stdlib in a flat ~/.cyrius/lib that
          # 6.0.x ignores: harmless while lib/ was committed, broken once
          # the checkout stopped shipping it. Matches patra / sigil.
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      # Populates ./lib from the version-matched toolchain snapshot
      # (gitignored since 2.2.2 — ADR 0018). Required before build.
      - name: Resolve dependencies
        run: cyrius deps

      # Generate src/grammar_blobs.cyr from grammars/*.cyml. The
      # blob file is gitignored — it inlines every grammar as a
      # Cyrius string literal so dist/vyakarana.cyr is a true
      # self-contained bundle for downstream `cyrius deps`
      # consumers (see ADR 0014). Required before every build /
      # test / distlib step.
      - name: Embed grammars
        run: sh scripts/embed-grammars.sh

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/vyk

      # Mandatory pre-release: lint (zero warnings) + fmt --check
      # (no drift) across every hand-edited Cyrius file.
      # `scripts/lint-fmt.sh` is the canonical wrapper, also
      # invoked locally via the gate sequence in CLAUDE.md. Skips
      # src/grammar_blobs.cyr — auto-generated; long string-literal
      # lines are intentional.
      - name: Lint + fmt
        run: sh scripts/lint-fmt.sh

      - name: Test
        run: cyrius test tests/vyakarana.tcyr

      - name: Smoke test
        run: sh scripts/smoke.sh build/vyk

      # The shipped (CYRIUS_DCE=1) binary against its 300 KiB budget
      # (ADR 0029). Builds its own DCE binary; build/vyk above is the
      # default build.
      - name: Size budget
        run: sh scripts/check-size.sh

      # The audit tools (scripts/audit/, 2.9.0) are not gates, but they
      # must still work when an audit reaches for them: build the
      # harness, run it once, and syntax-check every audit script.
      - name: Audit tools
        run: |
          cyrius build scripts/audit/harness.cyr build/vyk-audit
          build/vyk-audit auto tests/corpus/openqasm.qasm every
          for f in scripts/audit/*.sh scripts/bench-paired.sh; do sh -n "$f"; done

      # Fuzz harnesses. Random / adversarial inputs through the
      # streaming API, the three detect_language* entries, and the
      # CYML grammar parser, all holding the documented invariants
      # (coverage, no crash, registered-name return).
      #
      # `chunk_invariance.fcyr` (2.4.0) is the load-bearing one for
      # streaming: it runs tests/corpus/ through 8 chunk sizes and
      # asserts per-token (kind, start, len) equality against a
      # single-shot feed. `streaming.fcyr` asserted the same contract
      # on synthetic strings and passed while 13 of 20 real corpora
      # violated it — the inputs were the weak half. `cyrius fuzz`
      # auto-discovers harnesses, so this needs no new step.
      - name: Fuzz harnesses
        run: cyrius fuzz

      # Owl and other downstream consumers pull
      # `[deps.vyakarana] modules = ["dist/vyakarana.cyr"]` at a
      # tag — so the committed bundle must match what `cyrius
      # distlib` produces from the current `[lib]` block. If a dev
      # edited a src/*.cyr without rerunning distlib, fail here.
      - name: distlib drift check
        run: |
          if [ ! -f dist/vyakarana.cyr ]; then
            echo "::error::dist/vyakarana.cyr is missing — run 'cyrius distlib'" >&2
            exit 1
          fi
          cp dist/vyakarana.cyr dist/vyakarana.cyr.committed
          cyrius distlib
          if ! diff -q dist/vyakarana.cyr.committed dist/vyakarana.cyr > /dev/null; then
            echo "::error::dist/vyakarana.cyr is out of date — run 'cyrius distlib' and commit the result" >&2
            diff dist/vyakarana.cyr.committed dist/vyakarana.cyr | head -30 >&2
            exit 1
          fi
          rm dist/vyakarana.cyr.committed
